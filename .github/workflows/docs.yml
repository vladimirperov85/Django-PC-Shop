name: Documentation
on:
  push:
    branches:
      - main  # оставьте только ту ветку, которую используете
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7              # ✅ Сначала клонируем репо
      
      - uses: actions/configure-pages@v6       # ✅ Теперь настраиваем страницы
      
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      
      - run: pip install zensical
      
      - name: Build the site
        run: zensical build --clean
      
      - name: Debug - Show what was created   # 🔍 ОТЛАДКА
        run: |
          echo "=== Все файлы и папки в корне ==="
          ls -la
          echo ""
          echo "=== Ищем возможные выходные папки ==="
          find . -maxdepth 2 -type d \( -name "site" -o -name "_site" -o -name "build" -o -name "dist" -o -name "public" \) 2>/dev/null || echo "Ничего не найдено"
          echo ""
          echo "=== Размер папок (если есть) ==="
          du -sh */ 2>/dev/null || echo "Нет подпапок"
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site   # ⚠️ ВРЕМЕННО ОСТАВИЛ, НО МЫ ИЗМЕНИМ ПОСЛЕ ОТЛАДКИ
      
      - uses: actions/deploy-pages@v5
        id: deployment